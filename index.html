<!doctype html>
<html lang="en"<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}img{max-width:100%}</style>
<!--
  Kaleidobird landing page. Infinite lattice movement (design A).
  Everything embedded, no other files needed.
  All the knobs live in the "tunable design constants" block below.
  Note: switching SHEET_TWIST to Math.PI/2 gives the literal 90 degree
  variant (design B), where the bottom sheet moves perpendicular to the
  cursor and the top sheet ends up rotated 90 degrees.
-->
</head>
<body>
<title>Kaleidobird</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Azeret+Mono:wght@400;500&display=swap">
<style>
  /* Single committed visual world: sunlit water. Every color painted explicitly. */
  :root{
    --ink:#20456e;
    --ink-dim:rgba(32,69,110,.72);
    --ground:#d6dade;
    --accent:#e0854f;
    --line:rgba(32,69,110,.28);
  }
  html{background:var(--ground);height:100%;overflow:hidden}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:'Azeret Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    height:100%;overflow:hidden;
    cursor:crosshair;
  }
  #cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0}

  header{
    position:fixed;top:0;left:0;right:0;z-index:2;
    display:flex;align-items:baseline;justify-content:space-between;
    padding:26px 34px;pointer-events:none;
  }
  .name{
    font-family:'Fraunces',Georgia,'Times New Roman',serif;
    font-weight:560;font-size:clamp(2px,1.9vw,24px);letter-spacing:.01em;
    color:var(--ink);text-shadow:0 1px 16px rgba(255,255,255,.85);
    text-decoration:none;pointer-events:auto;
    display:inline-block;line-height:1;
    padding:8px 16px;border:1px solid var(--line);border-radius:999px;
    background:rgba(255,255,255,.45);backdrop-filter:blur(6px);
    transition:background .25s ease,color .25s ease,border-color .25s ease;
  }
  .name:hover,.name:focus-visible{
    background:rgba(255,255,255,.85);
    border-color:var(--accent);color:var(--ink);
    box-shadow:0 0 0 4px rgba(139, 145, 233, 0.28);
  }
  .name .dot{color:var(--accent)}
  .tag{
    font-size:11px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--ink-dim);text-shadow:0 1px 10px rgba(255,255,255,.85);
  }

  #hint{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:2;
    font-size:11px;letter-spacing:.30em;text-transform:uppercase;
    color:var(--ink-dim);text-shadow:0 1px 8px rgba(255,255,255,.8);
    padding:10px 18px;border:1px solid var(--line);border-radius:999px;
    background:rgba(255,255,255,.45);backdrop-filter:blur(6px);
    transition:opacity 1.4s ease;pointer-events:none;white-space:nowrap;
  }
  #hint.gone{opacity:0}
  @media (prefers-reduced-motion:reduce){ #hint{transition:none} }
</style>

<canvas id="cv"></canvas>

<header>
  <a class="name" href="outline.html">Wyllie Fang</a>
  <div class="tag">Personal site</div>
</header>

<script>
(() => {
"use strict";

/* ================= tunable design constants =================
   INFINITE LATTICE MOVEMENT (design A).
   Seven sheets of the one picture. The bottom sheet is upright; each
   sheet above is rotated a further 7.5 degrees, to 45 at the top. Every
   sheet carries its cards on its OWN lattice: a square lattice of
   spacing L, rotated with the sheet. Punches are cut into the cards at
   every lattice point (none on the bottom sheet), tapered smallest at
   the bottom.
   Movement: the cursor drives a travel vector T. Each sheet moves by T
   rotated by (its rotation minus 45 degrees): the top sheet follows the
   cursor exactly, the bottom moves 45 degrees off, the sheets between
   fan smoothly. Because each sheet's lattice is its motion map applied
   to the stop lattice, EVERY time the top sheet completes a lattice
   step, every sheet lands on its own lattice: a complete aligned stack
   at every stop, with another card's swimmer in the well, repeating
   forever in every direction. A soft magnet settles the travel onto
   the nearest stop. Scroll wheel zooms. */
const LAYERS       = 7;      // 6 punched sheets over 1 unpunched floor
const SHEET_TWIST  = Math.PI/4;  // rotation accumulated from bottom (0) to the top sheet (45 degrees)
const CARD_K       = 1.5;    // 1.5 images cover the screen height
const LATTICE_K    = 1.0;    // lattice spacing as a fraction of the image WIDTH; 1.0 or less = no gaps
const DRIFT_K      = 0.14;   // dragged drift, fraction of the small screen side
const DRIFT_EASE   = 0.028;  // slow ease of the drift (the drag)
const EASE         = 0.08;   // cursor smoothing per frame
const IDLE_K       = 0.05;   // idle sway amplitude, fraction of the triangle size
const SIZE_MIN_F   = 0.68;   // deepest punch as a fraction of the top one (never crops the swimmer)
const SNAP_R_K     = 0.38;   // magnet radius, fraction of the lattice spacing
const SNAP_W       = 0.75;   // magnet strength
const ZOOM_MAX     = 3.2;    // scroll wheel zooms in up to this factor
const ZOOM_SPEED   = 0.0012; // wheel sensitivity
const TRI          = [[1,0],[-0.5,0.8660],[-0.5,-0.8660]];  // equilateral, pointing up in the picture
const ORI          = -Math.PI/2;

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= setup ================= */

const ctx = cv.getContext('2d');
const hint = document.getElementById('hint');

let vw=0, vh=0, dpr=1, dprCap=1.5, TS=0, L=0, bendMax=0, bendRef=0, driftMax=0, idleAmp=0;
let cw=0, ch=0, STOPS=[], SHEETS=[];

function layout(){
  vw = innerWidth; vh = innerHeight;
  dpr = Math.min(devicePixelRatio||1, dprCap);
  cv.width  = Math.round(vw*dpr);
  cv.height = Math.round(vh*dpr);
  const s = (vh/CARD_K)/figImg.naturalHeight;
  cw = figImg.naturalWidth*s; ch = figImg.naturalHeight*s;
  TS = 0.55*cw;
  L  = cw*LATTICE_K;          // spacing = image width: columns touch, rows shingle, no gray between
  bendMax  = 1.55*L;            // far enough to reach the diagonal stops
  bendRef  = 0.55*Math.min(vw,vh);
  driftMax = Math.min(vw,vh)*DRIFT_K;
  idleAmp  = reduceMotion ? 0 : TS*IDLE_K;

  // the stop lattice: the TOP sheet's lattice in screen space (square L, rotated 45)
  STOPS = [];
  const c45 = Math.SQRT1_2;
  for(let m=-2; m<=2; m++){
    for(let n=-2; n<=2; n++){
      const px = (m-n)*L*c45, py = (m+n)*L*c45;
      if(Math.hypot(px,py) <= bendMax*1.02) STOPS.push({x:px, y:py});
    }
  }

  // the seven sheets, bottom to top
  SHEETS = [];
  const P = LAYERS-1;
  for(let i=0; i<LAYERS; i++){
    const psi = (i===0) ? 0 : SHEET_TWIST*i/P;          // visual rotation
    const phi = psi - SHEET_TWIST;                       // motion direction offset (top = 0)
    SHEETS.push({
      psi, phi,
      holes: i>0,
      ts: (i===0) ? 0 : TS*(SIZE_MIN_F + (1-SIZE_MIN_F)*(i-1)/(P-1))
    });
  }
}

/* ================= pointer and wheel ================= */
let targX = 0, targY = 0, curX = 0, curY = 0, dragX = 0, dragY = 0;
let targZ = 1, zoom = 1;
let interacted = false;

function firstMove(){
  if(!interacted){ interacted = true; setTimeout(()=>hint.classList.add('gone'), 2500); }
}
addEventListener('pointermove', e => {
  targX = e.clientX; targY = e.clientY; firstMove();
}, {passive:true});
addEventListener('touchmove', e => {
  const t = e.touches[0]; if(!t) return;
  targX = t.clientX; targY = t.clientY; firstMove();
}, {passive:true});
addEventListener('wheel', e => {
  e.preventDefault();
  targZ = Math.min(ZOOM_MAX, Math.max(1, targZ*Math.exp(-e.deltaY*ZOOM_SPEED)));
  firstMove();
}, {passive:false});
addEventListener('resize', layout);

/* ================= drawing helpers ================= */
function triPath(cx, cy, s){
  const co = Math.cos(ORI), si = Math.sin(ORI);
  for(let k=0; k<3; k++){
    const vx = TRI[k][0]*s, vy = TRI[k][1]*s;
    const px = cx + vx*co - vy*si, py = cy + vx*si + vy*co;
    if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
}

/* ================= frame loop ================= */
let fpsN = 0, fpsT = 0, degraded = false;

function frame(t){
  if(!degraded){
    if(fpsN===0) fpsT = t;
    if(++fpsN === 120){
      const fps = 119000/(t-fpsT);
      if(fps < 30 && dpr > 1){ dprCap = 1; degraded = true; layout(); }
      else degraded = true;
    }
  }
  curX += (targX-curX)*EASE;
  curY += (targY-curY)*EASE;
  dragX += (targX-dragX)*DRIFT_EASE;
  dragY += (targY-dragY)*DRIFT_EASE;
  zoom  += (targZ-zoom)*0.12;

  const ccx = vw/2, ccy = vh/2;

  // travel vector: fast bend plus the slow dragged follower, both saturated
  const dx = curX-ccx, dy = curY-ccy;
  const m1 = Math.hypot(dx,dy) || 1;
  const bMag = bendMax * Math.tanh(m1/bendRef) * (reduceMotion ? 0.5 : 1);
  const ddx = dragX-ccx, ddy = dragY-ccy;
  const m2 = Math.hypot(ddx,ddy) || 1;
  const gMag = driftMax * Math.tanh(m2/bendRef) * (reduceMotion ? 0.5 : 1);
  let Tx = dx/m1*bMag + ddx/m2*gMag;
  let Ty = dy/m1*bMag + ddy/m2*gMag;

  // soft magnet onto the nearest stop: there, every sheet is in perfect register
  let bD = 1e9, bX = 0, bY = 0;
  for(const st of STOPS){
    const d = Math.hypot(Tx-st.x, Ty-st.y);
    if(d < bD){ bD = d; bX = st.x; bY = st.y; }
  }
  const snapR = SNAP_R_K*L;
  if(bD < snapR){
    const w = Math.pow(1 - bD/snapR, 2) * SNAP_W;
    Tx += (bX-Tx)*w; Ty += (bY-Ty)*w;
  }
  // Tx += Math.cos(t*0.00030) * idleAmp;
  // Ty += Math.sin(t*0.00024) * idleAmp;
  Tx += Math.cos(t*0.00006) * L*1.6;
  Ty += Math.sin(t*0.000043) * L*1.6;

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = '#d6dade'; ctx.fillRect(0,0,vw,vh);

  // scroll wheel zoom, about the screen center
  ctx.translate(ccx, ccy); ctx.scale(zoom, zoom); ctx.translate(-ccx, -ccy);

  const viewR = Math.hypot(vw,vh)/2 + Math.hypot(cw,ch)/2;
  const NR = Math.ceil((Math.hypot(vw,vh)/2 + bendMax + Math.hypot(cw,ch)/2)/L) + 1;

  // sheets bottom to top; each moves by the travel rotated into its own direction
  for(const sh of SHEETS){
    const cphi = Math.cos(sh.phi), sphi = Math.sin(sh.phi);
    const Dx = Tx*cphi - Ty*sphi, Dy = Tx*sphi + Ty*cphi;
    const cpsi = Math.cos(sh.psi), spsi = Math.sin(sh.psi);

    // collect this sheet's visible lattice points (local frame, square lattice)
    const pts = [];
    for(let mm=-NR; mm<=NR; mm++){
      for(let nn=-NR; nn<=NR; nn++){
        const lx = mm*L, ly = nn*L;                    // local offset from screen center
        const sx = lx*cpsi - ly*spsi + Dx;             // on screen (relative to center)
        const sy = lx*spsi + ly*cpsi + Dy;
        if(Math.hypot(sx,sy) > viewR) continue;
        pts.push({x: ccx+lx, y: ccy+ly});
      }
    }
    if(!pts.length) continue;
    pts.sort((a,b)=> a.y-b.y || a.x-b.x);   // coherent shingling: lower rows overlap upper

    ctx.save();
    // enter the sheet's frame: its slide, then its rotation about the screen center
    ctx.translate(Dx, Dy);
    ctx.translate(ccx, ccy); ctx.rotate(sh.psi); ctx.translate(-ccx, -ccy);

    if(sh.holes){
      ctx.beginPath();
      ctx.rect(-vw*2, -vh*2, vw*5, vh*5);
      for(const p of pts) triPath(p.x, p.y, sh.ts);
      ctx.clip('evenodd');
    }
    for(const p of pts){
      ctx.drawImage(figImg, p.x-cw/2-0.5, p.y-ch/2-0.5, cw+1, ch+1);  // 1px bleed hides hairline seams
    }
    ctx.restore();
  }

  requestAnimationFrame(frame);
}

figImg.onload = () => {
  layout();
  targX = innerWidth/2; targY = innerHeight/2;
  curX = targX; curY = targY; dragX = targX; dragY = targY;
  requestAnimationFrame(frame);
};
})();
</script>
