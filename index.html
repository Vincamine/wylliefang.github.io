<!DOCTYPE html>
<html lang="en">

<head>

  <title>Wyllie Fang</title>
  <link rel="stylesheet" href="style.css">

<body class="is-cover">

  <!-- 第一页：Cargo 的 Backdrop: Parallax
       7 层倾斜图层 + 三角形 knockout 蒙版 + 285° 鼠标视差，
       图层数、蒙版、旋转倾斜都在 assets/backdrop.js 的 CONFIG 里 -->

  <main class="cover">

    <div class="backdrop" data-backdrop></div>

  </main>

  <!-- 前景：脱离视差层，独立悬浮在最顶上，不受倾斜和位移影响
       foreground — outside the parallax, pinned above everything -->

  <a class="cover-badge" href="intro.html">
    <span class="cover-badge-glyph" aria-hidden="true">&#8734;</span>
    <span data-name-short>Wyllie Fang</span>
    <span class="cover-badge-glyph" aria-hidden="true">&#8734;</span>
  </a>

  <script src="assets/backdrop.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/script.js"></script>

</body>

</html>
